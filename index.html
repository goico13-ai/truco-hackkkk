<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrucoX Ultimate Card Reader</title>
    <style>
        body { margin: 0; padding: 0; background: #1a1a1a; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        /* El contenedor del iframe */
        #game-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; /* Permite clicks a través si es necesario, o quita esta línea para jugar */
        }
        
        iframe {
            width: 100%; height: 100%; border: none;
            pointer-events: auto; /* Reactiva los clicks para jugar dentro del iframe */
        }

        /* Overlay de lectura de cartas */
        #card-overlay {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.95);
            color: #00ff00;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #00ff00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.4);
            z-index: 1000000;
            display: none;
            text-align: center;
            min-width: 200px;
        }

        #card-overlay h3 { margin: 0 0 10px 0; font-size: 14px; color: #fff; text-transform: uppercase; letter-spacing: 1px; }
        #cards-display { font-size: 24px; font-weight: bold; color: #ffff00; letter-spacing: 2px; }
        
        /* Estado de conexión */
        #status {
            position: fixed;
            top: 10px; right: 10px;
            background: rgba(0,0,0,0.8); color: white;
            padding: 5px 10px; border-radius: 4px;
            font-size: 12px; z-index: 1000001;
        }
    </style>
</head>
<body>

    <div id="status">Iniciando...</div>
    <div id="game-container">
        <!-- El iframe cargará TrucoX -->
        <iframe id="gameFrame" src="https://www.trucox.com/" sandbox="allow-same-origin allow-scripts allow-popups allow-forms"></iframe>
    </div>

    <div id="card-overlay">
        <h3>Mano del Rival</h3>
        <div id="cards-display">--</div>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const overlay = document.getElementById('card-overlay');
        const cardsDisplay = document.getElementById('cards-display');
        const iframe = document.getElementById('gameFrame');

        // Configuración
        const TRUCOX_URL = "https://www.trucox.com/";
        
        // Script que inyectaremos DENTRO del iframe para capturar los datos
        const injectionScript = `
        (function() {
            console.log("[TRUCOX-HACK] Inyector iniciado dentro del iframe.");
            
            let lastCards = [];
            let timeoutId = null;

            // Función para actualizar la UI externa
            function notifyParent(cards) {
                if (JSON.stringify(cards) !== JSON.stringify(lastCards)) {
                    lastCards = cards;
                    window.parent.postMessage({ type: 'TRUCOX_CARDS', data: cards }, '*');
                    
                    // Actualizar también dentro del iframe por si acaso
                    let disp = document.getElementById('hack-display');
                    if(disp) disp.innerText = cards.join(', ');
                }
            }

            // Monkey-patch de WebSocket
            const originalWebSocket = window.WebSocket;
            window.WebSocket = function(url, protocols) {
                const ws = new originalWebSocket(url, protocols);
                
                ws.addEventListener('message', (event) => {
                    try {
                        let data = event.data;
                        
                        // Manejo de ArrayBuffer (común en juegos modernos)
                        if (data instanceof ArrayBuffer) {
                            const decoder = new TextDecoder();
                            data = decoder.decode(data);
                        }

                        if (typeof data === 'string') {
                            try {
                                const json = JSON.parse(data);
                                processJson(json);
                            } catch (e) {}
                        }
                    } catch (e) {}
                });

                return ws;
            };

            // Algoritmo recursivo para encontrar arrays de cartas
            function processJson(obj) {
                if (!obj || typeof obj !== 'object') return;

                // 1. Búsqueda directa por claves comunes
                const keys = ['opponentCards', 'opponentHand', 'rivalHand', 'cards', 'hand'];
                for (let k of keys) {
                    if (Array.isArray(obj[k])) {
                        const clean = extractCards(obj[k]);
                        if (clean.length > 0) {
                            notifyParent(clean);
                            return;
                        }
                    }
                }

                // 2. Búsqueda recursiva profunda
                const found = searchDeep(obj);
                if (found && found.length > 0) {
                    notifyParent(found);
                }
            }

            function extractCards(arr) {
                // Filtra solo elementos que parezcan cartas (Números 1-10 o letras J,Q,K,A)
                return arr.filter(c => 
                    (typeof c === 'number' && c >= 1 && c <= 10) || 
                    (typeof c === 'string' && /^[JQKA]$/.test(c.toUpperCase()))
                );
            }

            function searchDeep(obj, visited = new Set()) {
                if (obj === null || typeof obj !== 'object') return null;
                if (visited.has(obj)) return null;
                visited.add(obj);

                if (Array.isArray(obj)) {
                    // Si es un array y todos son números pequeños (<11), asumimos que es una mano
                    if (obj.every(n => typeof n === 'number' && n <= 10) && obj.length >= 3 && obj.length <= 5) {
                        return obj;
                    }
                } else {
                    for (let key in obj) {
                        const res = searchDeep(obj[key], visited);
                        if (res) return res;
                    }
                }
                return null;
            }

            // Inyección visual interna (debug)
            const div = document.createElement('div');
            div.id = 'hack-display';
            div.style.cssText = 'position:fixed; top:10px; left:10px; color:red; font-family:monospace; z-index:999999; background:black; padding:5px;';
            document.body.appendChild(div);
            
            // Intento inicial por si ya había conexión abierta
            setTimeout(() => {
                console.log("[TRUCOX-HACK] Listo para escuchar.");
            }, 2000);
        })();
        `;

        // Escuchar mensajes del iframe
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'TRUCOX_CARDS') {
                const cards = event.data.data;
                if (cards && cards.length > 0) {
                    overlay.style.display = 'block';
                    cardsDisplay.innerText = cards.join(' | ');
                    statusEl.innerText = "Cartas leídas: " + cards.join(',');
                    statusEl.style.color = "#0f0";
                }
            }
        });

        // Cuando el iframe cargue, inyectamos el script
        iframe.onload = () => {
            statusEl.innerText = "Inyectando script...";
            try {
                // Inyectamos el script en el contexto del iframe
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                const script = doc.createElement('script');
                script.textContent = injectionScript;
                doc.body.appendChild(script);
                statusEl.innerText = "Esperando partida...";
            } catch (e) {
                statusEl.innerText = "Error CORS o carga: " + e.message;
                console.error(e);
            }
        };

        // Fallback: Si el iframe tarda mucho, forzamos la inyección después de 5 segundos
        setTimeout(() => {
            if (!iframe.contentDocument) {
                statusEl.innerText = "Intentando inyección tardía...";
                iframe.src = TRUCOX_URL; // Recargar para disparar onload de nuevo
            }
        }, 5000);

    </script>
</body>
</html>
