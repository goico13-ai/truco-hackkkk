<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrucoX Hack - Menú Flotante</title>
    <style>
        body { margin: 0; padding: 0; background: #1a1a1a; overflow: hidden; font-family: sans-serif; }
        
        /* Contenedor del juego */
        #game-container {
            width: 100vw; height: 100vh;
            position: relative;
        }

        iframe {
            width: 100%; height: 100%; border: none; display: block;
        }

        /* Botón Flotante */
        #hack-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 999999;
            background: #ff0055;
            color: white;
            border: 2px solid white;
            padding: 12px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.2s;
            font-size: 14px;
        }
        #hack-btn:hover { transform: scale(1.1); background: #ff3377; }
        #hack-btn:active { transform: scale(0.95); }

        /* Panel de Resultados */
        #result-panel {
            position: fixed;
            top: 80px;
            right: 20px;
            z-index: 999998;
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid #ff0055;
            border-radius: 10px;
            padding: 15px;
            min-width: 200px;
            display: none;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
        }
        #result-panel h4 { margin: 0 0 10px 0; color: #fff; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        .card-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 5px; }
        .card { 
            background: #fff; color: #000; padding: 5px 10px; border-radius: 4px; 
            font-weight: bold; font-size: 18px; border: 1px solid #ccc;
        }
        .card.high { background: #ffeebb; border-color: #ffa500; }
        .card.low { background: #e0e0e0; }
        
        #status-msg {
            position: fixed; bottom: 10px; left: 10px;
            color: #aaa; font-size: 11px; z-index: 999999;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Cargamos TrucoX directamente -->
        <iframe id="trucox-frame" src="https://www.trucox.com/" allow="clipboard-write"></iframe>
    </div>

    <!-- Botón Flotante -->
    <button id="hack-btn">👁️ Ver Cartas Rival</button>

    <!-- Panel de Resultados -->
    <div id="result-panel">
        <h4>Mano del Rival</h4>
        <div id="cards-output" class="card-row"></div>
    </div>

    <div id="status-msg">Esperando carga...</div>

    <script>
        const btn = document.getElementById('hack-btn');
        const panel = document.getElementById('result-panel');
        const output = document.getElementById('cards-output');
        const status = document.getElementById('status-msg');
        const iframe = document.getElementById('trucox-frame');

        // Función para formatear cartas
        function formatCards(cards) {
            if (!cards || cards.length === 0) return '<span style="color:#888">No detectadas</span>';
            
            let html = '';
            cards.forEach(c => {
                let val = c.toString();
                let cls = (parseInt(val) > 7) ? 'high' : 'low';
                html += `<div class="card ${cls}">${val}</div>`;
            });
            return html;
        }

        // Lógica principal de inyección
        function injectSpy() {
            try {
                const win = iframe.contentWindow;
                const doc = iframe.contentDocument;
                
                if (!win || !doc) {
                    status.innerText = "Esperando iframe...";
                    return false;
                }

                status.innerText = "Inyectando espía...";

                // Creamos un script que se ejecutará EN EL CONTEXTO DEL IFRAME
                const spyScript = `
(function() {
    console.log('[TRUCOX] Espía inyectado correctamente.');
    
    // Variable global para almacenar la última mano vista
    window.__TRUCOX_RIVAL_CARDS__ = [];

    // Intento 1: Buscar en el objeto raíz de React/Vite (común en SPAs)
    // A menudo las apps modernas guardan el estado en __REDUX_STATE__ o similares
    const searchObj = (obj, targetKey) => {
        if (!obj) return null;
        for (let key in obj) {
            if (key.includes(targetKey) && Array.isArray(obj[key])) {
                // Filtrar cartas válidas
                const valid = obj[key].filter(c => typeof c === 'number' && c >= 1 && c <= 10);
                if (valid.length > 0) return valid;
            }
            const res = searchObj(obj[key], targetKey);
            if (res) return res;
        }
        return null;
    };

    // Monitorizar cambios en el DOM o Estado
    // TrucoX suele actualizar el DOM cuando cambian las cartas. 
    // Vamos a usar un MutationObserver para detectar cuando aparecen elementos de cartas
    const observer = new MutationObserver((mutations) => {
        mutations.forEach(mutation => {
            if (mutation.addedNodes.length) {
                // Si se ha añadido un nodo, intentamos buscar cartas en el árbol
                const nodes = Array.from(mutation.addedNodes);
                for(let node of nodes) {
                    if(node.nodeType === 1) { // Element node
                        // Buscar clases típicas de cartas en TrucoX (ej: .card, .chip, etc)
                        // Esto es heurístico porque las clases cambian
                        const texts = [];
                        node.textContent.split(/\\s+/).forEach(t => {
                            if(/^\\d+$/.test(t) && parseInt(t) <= 10) texts.push(parseInt(t));
                        });
                        if(texts.length >= 3 && texts.length <= 5) {
                            window.__TRUCOX_RIVAL_CARDS__ = texts;
                        }
                    }
                }
            }
        });
    });

    observer.observe(doc.body, { childList: true, subtree: true });

    // También exponemos una función manual para que el botón la llame
    window.getRivalCards = function() {
        // 1. Intentar leer variable global si existe
        if(window.__TRUCOX_RIVAL_CARDS__ && window.__TRUCOX_RIVAL_CARDS__.length > 0) {
            return window.__TRUCOX_RIVAL_CARDS__;
        }

        // 2. Búsqueda profunda en el objeto window (para encontrar Redux/Store)
        const found = searchObj(win, 'opponent');
        if(found) return found;

        // 3. Búsqueda por texto en todo el documento (fallback)
        const allText = doc.body.innerText.match(/\\b[1-9]|10\\b/g);
        // Esto es muy rudo, mejor buscamos nodos específicos si conocemos la clase
        // Pero como no sabemos la versión exacta, devolvemos lo que tengamos
        
        return [];
    };
})();
`;

                // Inyectar el script
                const script = doc.createElement('script');
                script.textContent = spyScript;
                doc.head.appendChild(script);

                // Escuchar el evento click del botón desde DENTRO del iframe
                // Para evitar problemas de CORS, hacemos que el iframe envíe un postMessage
                const pollInterval = setInterval(() => {
                    try {
                        // Pedimos al iframe que ejecute getRivalCards
                        if (win.getRivalCards) {
                            const cards = win.getRivalCards();
                            if (cards && cards.length > 0) {
                                clearInterval(pollInterval);
                                // Enviamos al padre
                                win.parent.postMessage({ type: 'SHOW_CARDS', data: cards }, '*');
                            }
                        }
                    } catch(e) {}
                }, 1000); // Chequea cada segundo

                return true;

            } catch (e) {
                status.innerText = "Error de CORS o carga: " + e.message;
                return false;
            }
        }

        // Evento Click del botón flotante
        btn.addEventListener('click', () => {
            status.innerText = "Leyendo memoria...";
            panel.style.display = 'block';
            
            // Intento inmediato
            try {
                const cards = iframe.contentWindow.getRivalCards();
                if(cards && cards.length > 0) {
                    output.innerHTML = formatCards(cards);
                    status.innerText = "¡Cartas encontradas!";
                    return;
                }
            } catch(e) {}

            // Si no hay, escuchamos el mensaje del iframe
            const handler = (event) => {
                if (event.data && event.data.type === 'SHOW_CARDS') {
                    output.innerHTML = formatCards(event.data.data);
                    status.innerText = "Actualizado en tiempo real";
                    window.removeEventListener('message', handler);
                }
            };
            window.addEventListener('message', handler);
            
            // Forzar lectura inmediata de nuevo
            try { iframe.contentWindow.getRivalCards(); } catch(e){}
        });

        // Inicialización
        iframe.onload = () => {
            setTimeout(() => {
                const success = injectSpy();
                if(success) status.innerText = "Espía activo. Pulsa el botón.";
            }, 2000);
        };

    </script>
</body>
</html>
