<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TrucoX Ultimate Hack</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background: #1a1a1a; 
            overflow: hidden; 
            font-family: 'Segoe UI', sans-serif; 
        }
        
        /* Contenedor del juego */
        #game-wrapper {
            width: 100vw; 
            height: 100vh; 
            position: relative;
            background: #fff;
        }

        /* Botón Flotante Mejorado */
        #hack-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999999;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #hack-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
        #hack-btn:active { transform: scale(0.95); }
        #hack-btn .icon { font-size: 18px; }

        /* Panel de Resultados */
        #result-panel {
            position: fixed;
            top: 70px;
            right: 20px;
            z-index: 9999998;
            background: rgba(20, 20, 20, 0.98);
            border: 1px solid #764ba2;
            border-radius: 12px;
            padding: 15px;
            min-width: 200px;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #result-panel h4 { 
            margin: 0 0 10px 0; color: #fff; font-size: 12px; 
            text-transform: uppercase; letter-spacing: 1px; 
            border-bottom: 1px solid #444; padding-bottom: 8px;
        }
        .card-row { display: flex; gap: 8px; justify-content: center; }
        .card { 
            width: 35px; height: 50px; 
            border-radius: 5px; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 18px; border: 2px solid #555;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.3);
        }
        .card.high { background: #ffeaa7; border-color: #fdcb6e; color: #d35400; }
        .card.low { background: #dfe6e9; border-color: #b2bec3; color: #2d3436; }
        
        #status-msg {
            position: fixed; bottom: 10px; left: 10px;
            color: #aaa; font-size: 11px; z-index: 9999999;
            background: rgba(0,0,0,0.5); padding: 2px 5px; border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- Contenedor donde vivirá TrucoX -->
    <div id="game-wrapper"></div>

    <!-- Botón Flotante -->
    <button id="hack-btn">
        <span class="icon">👁️</span> Ver Rival
    </button>

    <!-- Panel de Resultados -->
    <div id="result-panel">
        <h4>Mano Detectada</h4>
        <div id="cards-output" class="card-row"></div>
    </div>

    <div id="status-msg">Iniciando...</div>

    <script>
        const btn = document.getElementById('hack-btn');
        const panel = document.getElementById('result-panel');
        const output = document.getElementById('cards-output');
        const status = document.getElementById('status-msg');
        const wrapper = document.getElementById('game-wrapper');

        // Función para renderizar cartas
        function formatCards(cards) {
            if (!cards || cards.length === 0) return '<span style="color:#666;font-size:12px">Sin datos</span>';
            let html = '';
            cards.forEach(c => {
                let val = c.toString();
                let cls = (parseInt(val) > 7) ? 'high' : 'low';
                html += `<div class="card ${cls}">${val}</div>`;
            });
            return html;
        }

        // Cargar TrucoX corrigiendo rutas agresivamente
        async function loadGame() {
            try {
                status.innerText = "Descargando motor...";
                
                // 1. Obtener el HTML principal
                const response = await fetch('https://www.trucox.com/');
                let htmlContent = await response.text();

                // 2. Corregir TODAS las rutas relativas
                // Convertimos "/assets/..." a "https://www.trucox.com/assets/..."
                htmlContent = htmlContent.replace(/href="([^"]+)"/g, (match, p1) => {
                    if(p1.startsWith('/')) return `href="https://www.trucox.com${p1}"`;
                    return match;
                });
                htmlContent = htmlContent.replace(/src="([^"]+)"/g, (match, p1) => {
                    if(p1.startsWith('/')) return `src="https://www.trucox.com${p1}"`;
                    return match;
                });
                // También corregir CSS si hay URLs incrustadas
                htmlContent = htmlContent.replace(/url\(['"]?([^'")]+)['"]?\)/g, (match, p1) => {
                    if(p1.startsWith('/')) return `url('https://www.trucox.com/${p1}')`;
                    return match;
                });

                // 3. Inyectar el HTML corregido
                wrapper.innerHTML = htmlContent;

                // 4. Ejecutar los scripts originales
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = htmlContent;
                const scripts = tempDiv.querySelectorAll('script[src]');
                
                for (let script of scripts) {
                    const newScript = document.createElement('script');
                    newScript.src = script.src;
                    newScript.async = true;
                    document.body.appendChild(newScript);
                }

                // Esperar a que la app se monte
                setTimeout(() => {
                    status.innerText = "Espía activo. Pulsa el botón.";
                    initSpySystem();
                }, 2000);

            } catch (error) {
                status.innerText = "Error crítico: " + error.message;
                console.error(error);
            }
        }

        // Sistema de Espionaje Híbrido
        function initSpySystem() {
            window.__TRUCOX_CARDS__ = [];

            // A) Interceptador de WebSocket (Lo más preciso)
            const originalWebSocket = window.WebSocket;
            window.WebSocket = function(url, protocols) {
                const ws = new originalWebSocket(url, protocols);
                
                ws.addEventListener('message', (e) => {
                    try {
                        let data = e.data;
                        if (data instanceof ArrayBuffer) {
                            data = new TextDecoder().decode(data);
                        }
                        
                        if (typeof data === 'string') {
                            try {
                                const json = JSON.parse(data);
                                analyzeData(json);
                            } catch (err) {}
                        }
                    } catch (err) {}
                });
                
                return ws;
            };

            // B) Observador del DOM (Respaldo visual)
            const observer = new MutationObserver((mutations) => {
                mutations.forEach(mutation => {
                    mutation.addedNodes.forEach(node => {
                        if (node.nodeType === 1 && node.textContent) {
                            const matches = node.textContent.match(/\b(?:10|[1-9])\b/g);
                            if (matches && matches.length >= 3 && matches.length <= 5) {
                                const valid = matches.map(n => parseInt(n)).filter(n => n>=1 && n<=10);
                                if(valid.length > 0) {
                                    window.__TRUCOX_CARDS__ = valid;
                                    updateUI(valid);
                                }
                            }
                        }
                    });
                });
            });
            observer.observe(document.body, { childList: true, subtree: true });
        }

        // Análisis profundo de objetos JSON
        function analyzeData(obj) {
            if(!obj) return;
            
            // Buscar claves comunes
            const keys = ['opponentCards', 'opponentHand', 'rivalHand', 'hand', 'cards'];
            for(let k of keys) {
                if(obj[k] && Array.isArray(obj[k])) {
                    const valid = obj[k].filter(c => typeof c === 'number' && c>=1 && c<=10);
                    if(valid.length > 0) {
                        window.__TRUCOX_CARDS__ = valid;
                        updateUI(valid);
                        return;
                    }
                }
            }

            // Recursión general
            const found = searchDeep(obj);
            if(found.length > 0) {
                window.__TRUCOX_CARDS__ = found;
                updateUI(found);
            }
        }

        function searchDeep(obj, visited = new Set()) {
            if (!obj || typeof obj !== 'object' || visited.has(obj)) return [];
            visited.add(obj);

            if (Array.isArray(obj)) {
                const isCards = obj.every(i => typeof i === 'number' && i >= 1 && i <= 10);
                if (isCards && obj.length >= 3 && obj.length <= 5) return obj;
            } else {
                for (let k in obj) {
                    const res = searchDeep(obj[k], visited);
                    if (res.length > 0) return res;
                }
            }
            return [];
        }

        function updateUI(cards) {
            if(cards && cards.length > 0) {
                output.innerHTML = formatCards(cards);
                panel.style.display = 'block';
                status.innerText = "Cartas actualizadas!";
            }
        }

        // Click del botón
        btn.addEventListener('click', () => {
            status.innerText = "Escaneando...";
            panel.style.display = 'block';
            
            // Intentar obtener datos actuales
            let cards = window.__TRUCOX_CARDS__;
            
            // Si está vacío, buscar en el estado global de la app
            if (!cards || cards.length === 0) {
                cards = searchDeep(window);
            }

            if(cards && cards.length > 0) {
                updateUI(cards);
            } else {
                output.innerHTML = formatCards([]);
                status.innerText = "No hay partida activa o aún no se han revelado las cartas.";
            }
        });

        // Arrancar
        loadGame();

    </script>
</body>
</html>
