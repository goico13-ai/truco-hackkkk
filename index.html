<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrucoX Hack - Menú Flotante</title>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        
        /* Contenedor donde vivirá TrucoX */
        #game-wrapper {
            width: 100vw; height: 100vh; position: relative;
        }

        /* Botón Flotante (Estilo Cyberpunk) */
        #hack-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 999999;
            background: linear-gradient(45deg, #ff0055, #ff5500);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 800;
            font-size: 16px;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #hack-btn:hover { transform: scale(1.1) rotate(-2deg); box-shadow: 0 0 25px rgba(255, 0, 85, 0.9); }
        #hack-btn:active { transform: scale(0.95); }

        /* Panel de Resultados */
        #result-panel {
            position: fixed;
            top: 80px;
            right: 20px;
            z-index: 999998;
            background: rgba(10, 10, 10, 0.95);
            border: 2px solid #ff0055;
            border-radius: 12px;
            padding: 20px;
            min-width: 220px;
            display: none;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.3);
            backdrop-filter: blur(5px);
        }
        #result-panel h4 { 
            margin: 0 0 15px 0; color: #fff; font-size: 14px; 
            text-transform: uppercase; letter-spacing: 2px; 
            border-bottom: 1px solid #333; padding-bottom: 10px;
        }
        .card-row { display: flex; gap: 12px; justify-content: center; }
        .card { 
            background: #fff; color: #000; width: 40px; height: 55px; 
            border-radius: 6px; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 20px; border: 2px solid #ccc;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
        }
        .card.high { background: #ffeaa7; border-color: #fdcb6e; color: #d35400; }
        .card.low { background: #dfe6e9; border-color: #b2bec3; }
        
        #status-msg {
            position: fixed; bottom: 10px; left: 10px;
            color: #666; font-size: 12px; z-index: 999999;
        }
    </style>
</head>
<body>

    <!-- Aquí se montará TrucoX -->
    <div id="game-wrapper"></div>

    <!-- Botón Flotante -->
    <button id="hack-btn">👁️ Ver Cartas Rival</button>

    <!-- Panel de Resultados -->
    <div id="result-panel">
        <h4>Mano del Rival</h4>
        <div id="cards-output" class="card-row"></div>
    </div>

    <div id="status-msg">Cargando motor...</div>

    <script>
        const btn = document.getElementById('hack-btn');
        const panel = document.getElementById('result-panel');
        const output = document.getElementById('cards-output');
        const status = document.getElementById('status-msg');
        const wrapper = document.getElementById('game-wrapper');

        function formatCards(cards) {
            if (!cards || cards.length === 0) return '<span style="color:#888">Esperando partida...</span>';
            let html = '';
            cards.forEach(c => {
                let val = c.toString();
                let cls = (parseInt(val) > 7) ? 'high' : 'low';
                html += `<div class="card ${cls}">${val}</div>`;
            });
            return html;
        }

        // Función para cargar TrucoX dentro del div (Evita problemas de Iframe)
        async function loadGame() {
            try {
                status.innerText = "Descargando TrucoX...";
                
                // 1. Descargar el HTML de TrucoX
                const response = await fetch('https://www.trucox.com/');
                const htmlContent = await response.text();

                // 2. Limpiar el contenido para evitar conflictos de estilos globales
                // Extraemos solo lo relevante o lo inyectamos tal cual
                wrapper.innerHTML = htmlContent;

                // 3. Ejecutar los scripts originales de TrucoX
                // Buscamos todos los scripts del HTML descargado y los ejecutamos en este contexto
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = htmlContent;
                const scripts = tempDiv.querySelectorAll('script[src]');
                
                for (let script of scripts) {
                    const newScript = document.createElement('script');
                    newScript.src = script.src;
                    newScript.async = true;
                    document.body.appendChild(newScript);
                }

                // Esperar a que TrucoX monte su UI
                setTimeout(() => {
                    status.innerText = "Espía activo. Pulsa el botón.";
                    initSpy();
                }, 3000);

            } catch (error) {
                status.innerText = "Error al cargar: " + error.message;
                console.error(error);
            }
        }

        // Lógica del Espía
        function initSpy() {
            // Variable global para almacenar cartas detectadas
            window.__TRUCOX_CARDS__ = [];

            // MutationObserver para detectar cuando aparecen cartas en el DOM
            const observer = new MutationObserver((mutations) => {
                mutations.forEach(mutation => {
                    mutation.addedNodes.forEach(node => {
                        if (node.nodeType === 1) { // Element node
                            // Buscar textos numéricos que parezcan cartas
                            const text = node.textContent || "";
                            const matches = text.match(/\b(?:10|[1-9])\b/g);
                            
                            if (matches && matches.length >= 3 && matches.length <= 5) {
                                // Si encontramos un array de números válido
                                const cards = matches.map(n => parseInt(n));
                                // Evitar falsos positivos (ej: coordenadas)
                                if (cards.every(n => n >= 1 && n <= 10)) {
                                    window.__TRUCOX_CARDS__ = cards;
                                    updateUI(cards);
                                }
                            }
                        }
                    });
                });
            });

            observer.observe(document.body, { childList: true, subtree: true });

            // Exponer función para lectura manual
            window.getRivalCards = () => {
                // Intentar leer desde el estado interno de la app si existe
                // A veces las apps guardan el estado en window.appState o similar
                if (window.__TRUCOX_CARDS__ && window.__TRUCOX_CARDS__.length > 0) {
                    return window.__TRUCOX_CARDS__;
                }
                
                // Búsqueda profunda en objetos globales
                const search = (obj, key) => {
                    if(!obj) return null;
                    for(let k in obj) {
                        if(k.includes(key) && Array.isArray(obj[k])) {
                            const valid = obj[k].filter(c => typeof c === 'number' && c>=1 && c<=10);
                            if(valid.length > 0) return valid;
                        }
                        const res = search(obj[k], key);
                        if(res) return res;
                    }
                    return null;
                };

                return search(window, 'opponent') || search(window, 'hand') || [];
            };
        }

        function updateUI(cards) {
            if(cards && cards.length > 0) {
                output.innerHTML = formatCards(cards);
                panel.style.display = 'block';
                status.innerText = "¡Cartas actualizadas!";
            }
        }

        // Evento Click
        btn.addEventListener('click', () => {
            status.innerText = "Escaneando...";
            panel.style.display = 'block';
            
            const cards = window.getRivalCards();
            if(cards && cards.length > 0) {
                updateUI(cards);
            } else {
                output.innerHTML = formatCards([]);
                status.innerText = "No se detectaron cartas. Asegúrate de estar en una partida activa.";
            }
        });

        // Iniciar carga
        loadGame();

    </script>
</body>
</html>
