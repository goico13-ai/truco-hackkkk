<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrucoX Ultimate</title>
    <style>
        body { margin: 0; padding: 0; background: #121212; overflow: hidden; }
        #game-wrapper { width: 100vw; height: 100vh; position: relative; }
        
        /* UI Overlay */
        #overlay-ui {
            position: fixed; top: 20px; right: 20px; z-index: 9999999;
            display: flex; flex-direction: column; gap: 10px; align-items: flex-end;
        }
        #btn-toggle {
            background: #6c5ce7; color: white; border: none; padding: 12px 24px;
            border-radius: 30px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
            transition: transform 0.2s;
        }
        #btn-toggle:hover { transform: scale(1.05); }
        
        #card-display {
            background: rgba(0,0,0,0.9); border: 2px solid #6c5ce7;
            border-radius: 12px; padding: 15px; min-width: 150px;
            text-align: center; display: none;
        }
        .card-item {
            display: inline-block; width: 30px; height: 45px;
            line-height: 45px; margin: 0 2px; border-radius: 4px;
            font-weight: bold; color: white;
        }
        .card-high { background-color: #fdcb6e; color: #d35400; }
        .card-low { background-color: #b2bec3; color: #2d3436; }
        
        #status {
            position: fixed; bottom: 10px; left: 10px;
            color: #fff; font-size: 12px; opacity: 0.7;
        }
    </style>
</head>
<body>

<div id="game-wrapper"></div>

<div id="overlay-ui">
    <button id="btn-toggle">👁️ Ver Rival</button>
    <div id="card-display"></div>
</div>

<div id="status">Iniciando proxy...</div>

<script>
    // CONFIGURACIÓN DEL PROXY CORS
    const PROXY_URL = 'https://corsproxy.io/?'; 
    const TARGET = 'https://www.trucox.com/';

    async function loadGame() {
        try {
            const status = document.getElementById('status');
            
            // 1. Descargar HTML vía Proxy
            status.innerText = "Conectando con proxy...";
            const response = await fetch(PROXY_URL + encodeURIComponent(TARGET));
            let html = await response.text();

            // 2. Corregir todas las rutas relativas
            html = html.replace(/href="([^"]+)"/g, (match, p1) => {
                return p1.startsWith('/') ? `href="${TARGET}${p1}"` : match;
            });
            html = html.replace(/src="([^"]+)"/g, (match, p1) => {
                return p1.startsWith('/') ? `src="${TARGET}${p1}"` : match;
            });
            html = html.replace(/url\(['"]?([^'")]+)['"]?\)/g, (match, p1) => {
                return p1.startsWith('/') ? `url('${TARGET}${p1}')` : match;
            });

            // 3. Inyectar HTML
            document.getElementById('game-wrapper').innerHTML = html;

            // 4. Ejecutar scripts manuales
            const temp = document.createElement('div');
            temp.innerHTML = html;
            const scripts = temp.querySelectorAll('script[src]');
            for(let s of scripts) {
                const newScript = document.createElement('script');
                newScript.src = s.src;
                document.body.appendChild(newScript);
            }

            status.innerText = "Listo. Pulsa el botón.";
            initSpy();

        } catch(e) {
            document.getElementById('status').innerText = "Error: " + e.message;
            console.error(e);
        }
    }

    function initSpy() {
        // Interceptador WebSocket
        const originalWS = window.WebSocket;
        window.WebSocket = function(url, protocols) {
            const ws = new originalWS(url, protocols);
            ws.addEventListener('message', (e) => {
                try {
                    let data = e.data;
                    if(data instanceof ArrayBuffer) data = new TextDecoder().decode(data);
                    
                    if(typeof data === 'string') {
                        const json = JSON.parse(data);
                        analyzeData(json);
                    }
                } catch(err) {}
            });
            return ws;
        };
    }

    function analyzeData(obj) {
        if(!obj) return;
        const keys = ['opponentCards', 'opponentHand', 'hand', 'cards'];
        for(let k of keys) {
            if(obj[k] && Array.isArray(obj[k])) {
                updateUI(obj[k]);
                return;
            }
        }
        // Búsqueda recursiva
        const found = searchDeep(obj);
        if(found.length > 0) updateUI(found);
    }

    function searchDeep(obj, visited = new Set()) {
        if (!obj || typeof obj !== 'object' || visited.has(obj)) return [];
        visited.add(obj);
        if (Array.isArray(obj)) {
            if (obj.every(i => typeof i === 'number' && i >= 1 && i <= 10) && obj.length >= 3) return obj;
        } else {
            for (let k in obj) {
                const res = searchDeep(obj[k], visited);
                if (res.length > 0) return res;
            }
        }
        return [];
    }

    function updateUI(cards) {
        if(!cards || cards.length === 0) return;
        const display = document.getElementById('card-display');
        display.style.display = 'block';
        display.innerHTML = cards.map(c => 
            `<span class="card-item ${c > 7 ? 'card-high' : 'card-low'}">${c}</span>`
        ).join('');
    }

    document.getElementById('btn-toggle').addEventListener('click', () => {
        const display = document.getElementById('card-display');
        display.style.display = display.style.display === 'none' ? 'block' : 'none';
    });

    loadGame();
</script>
</body>
</html>
