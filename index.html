<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrucoX Hack</title>
    <style>
        #card-hack-overlay {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.9);
            color: #0f0;
            padding: 10px;
            border-radius: 5px;
            z-index: 999999;
            font-family: monospace;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>
    <!-- Iframe para cargar TrucoX -->
    <iframe src="https://www.trucox.com/" style="width:100%; height:100vh; border:none;"></iframe>
    
    <div id="card-hack-overlay"></div>

    <script>
        // Esperamos a que cargue el iframe
        const iframe = document.querySelector('iframe');
        iframe.onload = () => {
            console.log("TrucoX cargado");
            
            // Sobrescribimos WebSocket para capturar mensajes
            const originalWebSocket = window.WebSocket;
            window.WebSocket = function(url, protocols) {
                const ws = new originalWebSocket(url, protocols);
                
                ws.addEventListener('message', (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        
                        // Buscamos cartas en el objeto
                        if (data.data && data.data.opponentCards) {
                            showCards(data.data.opponentCards);
                        } else if (data.data && data.data.opponentHand) {
                            showCards(data.data.opponentHand);
                        }
                    } catch (e) {}
                });
                
                return ws;
            };
        };

        function showCards(cards) {
            const overlay = document.getElementById('card-hack-overlay');
            overlay.style.display = 'block';
            overlay.innerText = "Rival: " + cards.join(", ");
        }
    </script>
</body>
</html>
